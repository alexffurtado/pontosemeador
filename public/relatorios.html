<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Relatórios - Plano Semeador</title>
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topo" id="topo-app"></header>

  <main>
    <h1 class="pagina-titulo">Meus relatórios<small>Consulte horas trabalhadas, atrasos e faltas por período.</small></h1>

    <div class="card">
      <div class="barra-filtros">
        <div class="campo">
          <label for="filtro-inicio">De</label>
          <input type="date" id="filtro-inicio">
        </div>
        <div class="campo">
          <label for="filtro-fim">Até</label>
          <input type="date" id="filtro-fim">
        </div>
        <div class="campo">
          <label for="filtro-preset">Período rápido</label>
          <select id="filtro-preset">
            <option value="mes-atual">Mês atual</option>
            <option value="mes-passado">Mês passado</option>
            <option value="30dias" selected>Últimos 30 dias</option>
            <option value="7dias">Últimos 7 dias</option>
          </select>
        </div>
        <div class="acoes">
          <button class="btn btn-secundario" id="btn-exportar-csv">Exportar CSV (Excel)</button>
          <button class="btn btn-secundario" id="btn-exportar-pdf">Exportar PDF</button>
          <button class="btn" id="btn-filtrar">Filtrar</button>
        </div>
      </div>
    </div>

    <div class="grade-resumo" id="grade-resumo"></div>

    <div class="card">
      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>Data</th><th>Dia</th><th>Marcações</th><th>Horas</th><th>Horas extras</th><th>Situação</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo">
            <tr><td colspan="6" class="carregando">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/relatorios.js"></script>
</body>
</html>
