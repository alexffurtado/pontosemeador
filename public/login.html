<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Plano Semeador | Ponto Digital</title>
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="tela-login">
    <div class="caixa-login">
      <div class="logo">
        <img src="/img/logo-completo.png" alt="Semeador - Plano Familiar" class="logo-login">
        <span>Sistema de Ponto Digital</span>
      </div>

      <div id="area-mensagem"></div>

      <form id="form-login">
        <div class="campo">
          <label for="login">Login</label>
          <input type="text" id="login" name="login" placeholder="seu nome de usuario" autocapitalize="off" autocorrect="off" required autofocus>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
        </div>
        <button type="submit" class="btn btn-bloco" id="btn-entrar">Entrar</button>
      </form>
      <p class="rodape-info">Acesso restrito aos colaboradores do Plano Semeador.</p>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
